[project]
name = "jellyfin-rpc"
version = "1.14.0"
description = "Discord RPC for Jellyfin"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiohttp-client-cache>=0.15.0",
    "requests>=2.34.2",
    "certifi>=2026.10.23",
    "pycountry>=26.2.16",
    "pypresence>=4.6.2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.12.0", "pyinstaller>=6.22.3"]

[dependency-groups]
dev = ["ruff>=0.17.2", "mypy>=2.4.0", "types-requests"]

[project.urls]
homepage = "https://github.com/kennethsible/jellyfin-rpc"

[project.scripts]
jellyfin-rpc = "jellyfin_rpc.main:main"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "S"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["S404", "S603", "S607"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true
untyped_calls_exclude = ["pypresence"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
