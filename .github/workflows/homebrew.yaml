name: Homebrew Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        type: string

permissions: {}

jobs:
  bump-cask:
    runs-on: macos-latest
    steps:
      - name: Bump Cask via Homebrew CLI
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          brew update
          brew tap kennethsible/tap
          brew trust kennethsible/tap
          brew bump-cask-pr \
            --version "$VERSION" \
            --no-browse \
            kennethsible/tap/jellyfin-rpc
