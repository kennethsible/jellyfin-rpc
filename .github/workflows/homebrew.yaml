name: Homebrew Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        type: string

permissions: {}

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    container:
      image: homebrew/brew
    steps:
      - name: Bump Cask via Homebrew CLI
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          BASE_URL="https://github.com/kennethsible/jellyfin-rpc/releases/download/v${VERSION}"
          ARM64_URL="${BASE_URL}/jellyfin-rpc-${VERSION}-macos-arm64.dmg"
          INTEL_URL="${BASE_URL}/jellyfin-rpc-${VERSION}-macos-amd64.dmg"

          echo "Downloading and calculating checksums..."
          ARM64_SHA=$(curl -sL "$ARM64_URL" | sha256sum | awk '{print $1}')
          INTEL_SHA=$(curl -sL "$INTEL_URL" | sha256sum | awk '{print $1}')

          brew tap kennethsible/tap
          brew bump-cask-pr \
            --version "$VERSION" \
            --sha256 "arm:$ARM64_SHA" \
            --sha256 "intel:$INTEL_SHA" \
            --no-browse \
            kennethsible/tap/jellyfin-rpc
