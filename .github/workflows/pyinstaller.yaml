name: PyInstaller Build

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-amd64
          - os: windows-11-arm
            platform: windows-arm64
          - os: macos-15-intel
            platform: macos-amd64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install Python Dependencies
        run: uv sync --locked --all-extras --no-dev
      - name: Build PyInstaller Executable
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            export MACOS_ARCH="arm64"
          elif [ "${{ matrix.platform }}" = "macos-amd64" ]; then
            export MACOS_ARCH="x86_64"
          fi
          uv run --no-sync pyinstaller main.spec --noconfirm
      - name: Build AppImage (Linux Only)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          VERSION=$(uv version --short)
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0

          mkdir -p dist/AppDir/usr/bin
          mkdir -p dist/AppDir/usr/lib
          cp images/icons/icon.png dist/AppDir/jellyfin-rpc.png
          mv "dist/Jellyfin RPC" dist/AppDir/usr/lib/jellyfin-rpc
          ln -s ../lib/jellyfin-rpc/jellyfin-rpc dist/AppDir/usr/bin/jellyfin-rpc

          ARCH_NAME=$(uname -m)
          cp -P /usr/lib/${ARCH_NAME}-linux-gnu/libxcb-cursor.so* dist/AppDir/usr/lib/

          mkdir -p dist/AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p dist/AppDir/usr/share/icons/hicolor/512x512/apps
          cp images/docs/icon_256x256.png dist/AppDir/usr/share/icons/hicolor/256x256/apps/jellyfin-rpc.png
          cp images/docs/icon_512x512.png dist/AppDir/usr/share/icons/hicolor/512x512/apps/jellyfin-rpc.png

          cat << 'EOF' > dist/AppDir/jellyfin-rpc.desktop
          [Desktop Entry]
          Type=Application
          Name=Jellyfin RPC
          Comment=Discord Rich Presence for Jellyfin
          Exec=jellyfin-rpc
          Icon=jellyfin-rpc
          Terminal=false
          Categories=Network;
          StartupWMClass=jellyfin-rpc
          EOF

          cat << 'EOF' > dist/AppDir/AppRun
          #!/bin/sh
          APPDIR="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${APPDIR}/usr/lib/jellyfin-rpc:${LD_LIBRARY_PATH}"
          exec "${APPDIR}/usr/bin/jellyfin-rpc" "$@"
          EOF
          chmod +x dist/AppDir/AppRun

          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH_NAME}.AppImage"
          chmod +x "appimagetool-${ARCH_NAME}.AppImage"
          "./appimagetool-${ARCH_NAME}.AppImage" --appimage-extract
          mv squashfs-root appimagetool.AppDir

          export ARCH="${ARCH_NAME}"
          UPDATE_INFO="gh-releases-zsync|kennethsible|jellyfin-rpc|latest|*${{ matrix.platform }}*.AppImage.zsync"
          APPIMAGE_NAME="jellyfin-rpc-${VERSION}-${{ matrix.platform }}.AppImage"
          ./appimagetool.AppDir/AppRun -u "$UPDATE_INFO" dist/AppDir "$APPIMAGE_NAME"

          mv "${APPIMAGE_NAME}"* dist/
          rm -rf dist/AppDir appimagetool.AppDir "appimagetool-${ARCH_NAME}.AppImage"
      - name: Build Disk Image (macOS Only)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          VERSION=$(uv version --short)
          brew install create-dmg
          create-dmg \
            --volname "Jellyfin RPC v$VERSION" \
            --window-size 440 270 \
            --icon-size 100 \
            --icon "Jellyfin RPC.app" 100 100 \
            --hide-extension "Jellyfin RPC.app" \
            --app-drop-link 300 100 \
            --no-internet-enable \
            "dist/jellyfin-rpc-$VERSION-${{ matrix.platform }}.dmg" \
            "dist/Jellyfin RPC.app"
      - name: Build Inno Setup (Windows Only)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $VERSION = uv version --short
          iscc "/DMyAppVersion=$VERSION" "/Fjellyfin-rpc-$VERSION-${{ matrix.platform }}" jellyfin-rpc.iss
      - name: Prepare Artifact Name
        shell: bash
        run: |
          VERSION=$(uv version --short)
          echo "ARTIFACT_NAME=jellyfin-rpc-$VERSION-${{ matrix.platform }}" >> $GITHUB_ENV
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            echo 'ARTIFACT_PATH=dist/*.AppImage*' >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == windows* ]]; then
            echo 'ARTIFACT_PATH=dist/installer/*.exe' >> $GITHUB_ENV
          else
            echo 'ARTIFACT_PATH=dist/*.dmg' >> $GITHUB_ENV
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
