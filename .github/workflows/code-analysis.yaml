name: Code Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install Python Dependencies
        run: uv sync --locked --all-extras
      - name: Ruff Linter Check
        run: uv run --no-sync ruff check src/
      - name: Ruff Formatter Check
        run: uv run --no-sync ruff format --check src/
      - name: Mypy Strict Type Check
        run: uv run --no-sync mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install Python Dependencies
        run: uv sync --locked --all-extras --no-dev
      - name: Static Security Scan (flake8-bandit)
        run: >-
          uvx ruff check src/
          --config "lint.extend-select=[]"
          --select S
          --output-format sarif
          --output-file ruff.sarif
        continue-on-error: true
      - name: Upload Results to GitHub Security
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ruff.sarif
      - name: Python Dependency Audit (pip-audit)
        run: uv run --no-sync --with pip-audit pip-audit --skip-editable
