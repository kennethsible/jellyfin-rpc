name: Bug Report
description: Report an issue or unexpected behavior in Jellyfin RPC.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the details below so we can diagnose and resolve the issue quickly.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running Jellyfin RPC on?
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: rpc-version
    attributes:
      label: RPC Version
      description: What version of Jellyfin RPC are you using?
      placeholder: "e.g., 1.14.0"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server Version
      description: What version is your Jellyfin server running?
      placeholder: "e.g., 12.4"
    validations:
      required: true
  - type: input
    id: client-info
    attributes:
      label: Client Information
      description: Which Jellyfin client are you playing media from?
      placeholder: "e.g., Jellyfin Media Player / Web"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened? What did you expect would happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: |
        Paste the contents of your log file below.

        *Please review and redact any sensitive information.*

        Log files default to the following directories:
        - Windows: `%AppData%\Jellyfin RPC`
        - macOS: `~/Library/Application Support/Jellyfin RPC`
        - Linux: `~/.config/jellyfin-rpc`
      render: shell
    validations:
      required: false
